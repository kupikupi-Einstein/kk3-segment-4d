<style>
:root{--bg:#0b1220;--panel:rgba(12,18,30,.74);--panel2:rgba(20,28,44,.85);--line:rgba(255,255,255,.09);--txt:#e9eef5;--mut:#93a1b5;--acc:#f0b429;--acc2:#22b8cf;--wip:#ff8a3d;--ok:#51cf66;--bad:#ff6b6b}
body[data-ui="light"]{--panel:rgba(255,255,255,.82);--panel2:rgba(245,247,250,.92);--line:rgba(10,20,40,.10);--txt:#13202f;--mut:#55657a;--acc:#c47f00;--acc2:#0b7285}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:13px}
#c{position:fixed;inset:0;display:block}
.glass{background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
button{font:inherit;font-size:12px;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 8px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--acc)} button.on{background:var(--acc);color:#111;border-color:var(--acc)}
select,input[type=range]{accent-color:var(--acc)}
select{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px}
#top{position:fixed;left:12px;right:12px;top:12px;display:flex;align-items:center;gap:12px;padding:7px 12px;z-index:5;height:56px}
#brand{display:flex;flex-direction:column;min-width:0;flex:1}
#brand b{font-size:15px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#brand span{color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbtns{margin-left:auto;display:flex;gap:5px;flex-wrap:nowrap;justify-content:flex-end;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button.on{background:var(--acc);color:#111}
#left{position:fixed;left:12px;top:78px;bottom:126px;width:390px;display:flex;flex-direction:column;z-index:4}
#tabs{display:flex;gap:4px;padding:8px 36px 0 8px}
#tabs button{flex:1;font-size:12px;padding:6px 4px}
#tabbody{flex:1;overflow:auto;padding:10px 12px 12px}
#right{position:fixed;right:12px;top:78px;width:300px;max-height:calc(100% - 200px);overflow:auto;padding:12px;z-index:4}
#bottom{position:fixed;left:12px;right:12px;bottom:12px;padding:10px 14px;z-index:5;display:flex;flex-direction:column;gap:6px}
#tlrow{display:flex;align-items:center;gap:10px}
#tlwrap{position:relative;flex:1;height:22px}
#tlwrap input{position:absolute;inset:0;width:100%;margin:0}
#ticks{position:relative;height:30px;font-size:10.5px;color:var(--mut)}
#ticks div{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
#ticks div.ms{color:var(--acc);top:15px!important}
#dateBig{font-size:26px;font-weight:600;line-height:1.1}
.mut{color:var(--mut)} .acc{color:var(--acc)}
h3{margin:12px 0 6px;font-size:13px;color:var(--acc);text-transform:uppercase;letter-spacing:.6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px}
.kpi b{display:block;font-size:18px}
.kpi span{font-size:11px;color:var(--mut)}
.bar{height:6px;background:rgba(127,127,127,.25);border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
#act{list-style:none;padding:0;margin:0}
#act li{padding:6px 8px;border-left:3px solid var(--wip);background:var(--panel2);border-radius:6px;margin-bottom:5px;font-size:12px}
#act li small{display:block;color:var(--mut)}
.grow{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:6px;font-size:11.5px;padding:2px 0;cursor:pointer}
.grow:hover .gl{color:var(--acc)}
.gl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt{position:relative;height:12px;background:rgba(127,127,127,.12);border-radius:3px}
.gb{position:absolute;top:2px;height:8px;border-radius:3px;background:var(--acc2)}
.gb.as{background:repeating-linear-gradient(45deg,#7c8aa0 0 4px,#5c6a80 4px 8px)}
.gb .pg{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:3px}
#gnow{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);pointer-events:none}
.ms-step{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.ms-step.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.ms-step b{display:block}
.ms-step .d{font-size:11px;color:var(--acc2)}
.ms-step ul{margin:5px 0 0;padding-left:16px;color:var(--mut);font-size:11.5px}
.cat{display:flex;align-items:center;gap:8px;padding:4px 0}
.cat i{width:12px;height:12px;border-radius:3px;display:inline-block}
.cat label{flex:1;cursor:pointer}
table.cyc{width:100%;border-collapse:collapse;font-size:11.5px}
table.cyc td{border-bottom:1px solid var(--line);padding:3px 4px}
#props{position:fixed;right:324px;top:78px;width:300px;padding:12px;z-index:6;display:none}
#props table{width:100%;font-size:12px;border-collapse:collapse}
#props td{padding:3px 2px;border-bottom:1px solid var(--line);vertical-align:top}
#props td:first-child{color:var(--mut);width:42%}
#hud{position:fixed;inset:0;pointer-events:none;z-index:3;display:none;font-family:ui-monospace,Consolas,monospace;color:#e9fff4;text-shadow:0 0 4px #000}
#hud .lb{position:absolute;left:0;right:0;height:9vh;background:#000}
#hud .tl{position:absolute;left:3%;top:12vh;font-size:13px;line-height:1.6}
#hud .tr{position:absolute;right:3%;top:12vh;font-size:13px;line-height:1.6;text-align:right}
#hud .bl{position:absolute;left:3%;bottom:12vh;font-size:13px}
#hud .cross{position:absolute;left:50%;top:50%;width:140px;height:90px;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.5);border-radius:4px}
#hud .cross:before,#hud .cross:after{content:"";position:absolute;background:rgba(255,255,255,.7)}
#hud .cross:before{left:50%;top:30%;bottom:30%;width:1px}
#hud .cross:after{top:50%;left:40%;right:40%;height:1px}
#hud .rec{color:#ff4d4d}
#caption{position:fixed;left:50%;bottom:14vh;transform:translateX(-50%);z-index:6;font-size:22px;font-weight:600;padding:10px 22px;display:none;text-align:center;max-width:86vw}
#caption small{display:block;font-size:13px;font-weight:400;color:var(--mut)}
#loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#0b1220;color:#e9eef5;transition:opacity .6s}
#loading .sp{width:44px;height:44px;border:3px solid rgba(255,255,255,.15);border-top-color:#f0b429;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#flyhelp{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:6;padding:6px 14px;display:none;font-size:12px}
body.noui #top,body.noui #left,body.noui #right,body.noui #bottom,body.noui #props{display:none!important}
body.hideL #left{display:none!important} body.hideR #right{display:none!important}
.pclose{position:absolute;top:6px;right:6px;z-index:2;padding:1px 7px;font-size:11px;line-height:1.4;border-radius:7px;opacity:.75}
.pclose:hover{opacity:1}
#modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 32px));max-height:calc(100% - 60px);overflow:auto;z-index:30;padding:18px;display:none}
#modalBack{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:29;display:none}
#drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;cursor:pointer;margin:10px 0;color:var(--mut)}
#drop.over{border-color:var(--acc);color:var(--txt)}
#impStatus{font-size:12px;line-height:1.55;margin:8px 0;white-space:pre-wrap}
#impStatus .ok{color:var(--ok)} #impStatus .bad{color:var(--bad)}
.mrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:10px}
#schedSrc{font-size:11px;color:var(--mut);margin-top:2px}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;border:1px solid var(--line)}
.pill.wip{background:var(--wip);color:#111}.pill.done{background:var(--ok);color:#111}.pill.plan{background:#7c8aa0;color:#111}
#mobileToggle{display:none}
@media (max-width:1250px){#brand span{display:none} #topbtns .lbl{display:none}}
@media (max-width:900px){#top{height:auto;flex-wrap:wrap} #left{width:auto;right:12px;top:auto;bottom:112px;height:45vh;display:none} #left.show{display:flex} #right{display:none} #mobileToggle{display:inline-block} #props{right:12px;left:12px;width:auto}}
</style>

</script>

<body>
<canvas id="c"></canvas>
<div id="loading"><div class="sp"></div><div id="loadTxt">4D BIM …</div></div>
<div id="top" class="glass">
  <div id="brand"><b id="ttl"></b><span id="sub"></span></div>
  <div id="topbtns">
    <button id="mobileToggle" data-i="panels"></button>
    <div class="seg" id="langSeg" title="ภาษา / Language"><button data-l="th">TH</button><button data-l="en">EN</button></div>
    <div class="seg" id="themes"><button data-t="day">☀ Day</button><button data-t="sunset">🌇 Sunset</button><button data-t="night">🌙 Night</button><button data-t="bim">▦ BIM 4D</button><button data-t="blue">⌗ Blueprint</button></div>
    <select id="view"></select>
    <button id="btnTour" data-i="tour"></button>
    <button id="btnFly" data-i="fly"></button>
    <button id="btnSound" data-i="sound"></button>
    <button id="btnMusic" data-i="music"></button>
    <button id="btnShot" data-it="shot">📷</button>
    <button id="btnGlb" data-it="glb">⬇ GLB</button>
    <button id="btnImport" data-i="import" data-it="importT"></button>
    <button id="btnLbl" class="on" data-i="labels" data-it="labelsT"></button>
    <button id="btnL" class="on" data-it="panelL">◧</button>
    <button id="btnR" class="on" data-it="panelR">◨</button>
    <button id="btnUI" data-it="hideUI">⤢</button>
  </div>
</div>
<div id="left" class="glass">
  <button class="pclose" id="closeL">✕</button>
  <div id="tabs"><button data-tab="gantt" data-i="tabGantt"></button><button data-tab="ms" data-i="tabMS"></button><button data-tab="model" data-i="tabModel"></button><button data-tab="src" data-i="tabSrc"></button></div>
  <div id="tabbody"></div>
</div>
<div id="right" class="glass">
  <button class="pclose" id="closeR">✕</button>
  <div class="mut" data-i="simDate"></div>
  <div id="dateBig">—</div>
  <div id="stepName" class="acc" style="margin-top:4px;font-weight:600"></div>
  <div id="schedSrc"></div>
  <div class="kpis" id="kpis"></div>
  <h3 data-i="scurve"></h3>
  <canvas id="scurve" width="276" height="90" style="width:100%;height:90px"></canvas>
  <h3 data-i="activities"></h3>
  <ul id="act"></ul>
</div>
<div id="props" class="glass"></div>
<div id="modalBack"></div>
<div id="modal" class="glass">
  <div style="display:flex;justify-content:space-between;align-items:center"><b class="acc" style="font-size:15px" data-i="impTitle"></b><button id="mClose">✕</button></div>
  <div class="mut" style="font-size:12px;margin-top:6px" data-i="impHelp"></div>
  <div id="drop" data-i="impDrop"></div>
  <input type="file" id="impFile" accept=".pdf,.xml,.csv,.json,.mpp,.txt" style="display:none">
  <div id="impStatus"></div>
  <div class="mrow"><button id="mReset" data-i="impReset"></button><button id="mExport" data-i="impExport"></button><button id="mApply" class="on" disabled data-i="impApply"></button></div>
</div>
<div id="bottom" class="glass">
  <div id="tlrow">
    <button id="btnPlay"></button>
    <select id="speed"><option value="0.1"></option><option value="0.5" selected></option><option value="2"></option><option value="7"></option><option value="15"></option><option value="30"></option></select>
    <div id="tlwrap"><input type="range" id="slider" min="0" max="1000" value="0"></div>
    <b id="dateSmall" style="min-width:132px;text-align:right"></b>
  </div>
  <div id="ticks"></div>
</div>
<div id="hud"><div class="lb" style="top:0"></div><div class="lb" style="bottom:0"></div><div class="tl" id="hudL"></div><div class="tr" id="hudR"></div><div class="bl" id="hudB"></div><div class="cross"></div></div>
<div id="caption" class="glass"></div>
<div id="flyhelp" class="glass" data-i="flyHelp"></div>

    pseg: { t: ['Pier / End segment', 'Pier / end segments'], grp: 'Superstructure', c: '#74c0fc' },
    seg: { t: ['Typical segment', 'Typical segments'], grp: 'Superstructure', c: '#d0ebff' },

    crane: { t: ['รถเครน (First span)', 'Mobile crane (first span)'], grp: 'Temporary Works', c: '#ffd43b' },

    dateOrder: 'dmy',
    dates: {

    { pos: [-40, 30, 45], target: [20, 14, 0], t: ['First span ML33–ML32', 'First span ML33–ML32'], s: ['Pier / End segment ติดตั้งด้วยรถเครน', 'Pier and end segments set by mobile crane'] },

function buildProject(api) {
  const { THREE, M, mesh, member, addEl, date, label, D, DAY, lerp, clamp } = api;
  const SPAN = 32.5, PX = n => (33 - n) * SPAN;                     // pier ML n → x
  const YT = 14.0, DEP = 2.2, YS = YT - DEP, YP = YS - .2;           // deck top, soffit, pier top (bearing 0.2 m)
  const YB = YT + 4.0, TH = 4.18, YTT = YB + TH;                     // truss bottom / top chord
  const LT = 2.45, LP = 2.5, LE = 1.2, CJ = .3;                     // typical / pier / end segment, closure joint
  const steelR = new THREE.MeshStandardMaterial({ color: 0xc92a2a, metalness: .45, roughness: .5 });
  const steelY = new THREE.MeshStandardMaterial({ color: 0xf2b705, metalness: .35, roughness: .55 });
  const steelD = new THREE.MeshStandardMaterial({ color: 0x343a40, metalness: .6, roughness: .45 });
  const barMat = new THREE.MeshStandardMaterial({ color: 0x9fa6ad, metalness: .9, roughness: .25 });
  const ply = new THREE.MeshStandardMaterial({ color: 0x8a6a4a, roughness: .9 });
  const box = (w, h, d, mat, x = 0, y = 0, z = 0) => { const m = mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); return m; };
  const bake = (meshes) => api.mergeGeometries(meshes.map(m => { m.updateMatrix(); return m.geometry.clone().applyMatrix4(m.matrix); }));
  const V = (x, y, z) => new THREE.Vector3(x, y, z);

  /* ---------- deck section (u = lateral, v = from deck top) ---------- */
  const OUT = [[-5, 0], [5, 0], [5, -.25], [3.0, -.55], [2.5, -DEP], [-2.5, -DEP], [-3.0, -.55], [-5, -.25]];
  const HOLE = [[-2.55, -.3], [-2.15, -DEP + .25], [2.15, -DEP + .25], [2.55, -.3]];
  const gCache = {};
  const segGeo = (L, solid) => gCache[L + '' + solid] || (gCache[L + '' + solid] = (() => {
    const sh = new THREE.Shape(OUT.map(([u, v]) => new THREE.Vector2(u, v))); if (!solid) sh.holes.push(new THREE.Path(HOLE.map(([u, v]) => new THREE.Vector2(u, v))));
    const g = new THREE.ExtrudeGeometry(sh, { depth: L, bevelEnabled: false }); g.translate(0, 0, -L / 2); g.rotateY(Math.PI / 2);
    const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) / 6, uv.getY(i) / 6); return g; })());
  const segObj = (L, solid, x) => { const o = new THREE.Group(), m = mesh(segGeo(L, solid), M.conc); o.add(m);
    // parapets cast with the segment
    [-4.85, 4.85].forEach(z => o.add(box(L - .02, .9, .3, M.barrier, 0, .45, z))); o.position.set(x, YT, 0); return o; };

  /* ---------- piers ML33 … ML24 (existing before erection) ---------- */
  const t0 = D(PROJECT.T0);
  for (let n = 33; n >= 24; n--) {
    const x = PX(n), o = new THREE.Group();
    const col = mesh(api.taper(YP - 3.4, 2.2, 2.8, 2.2, 2.8), M.conc); o.add(col);
    const head = mesh(api.taper(3.4, 2.2, 2.8, 3.0, 6.2), M.conc); head.position.y = YP - 3.4; o.add(head);
    const cap = box(6.5, 1.8, 6.5, M.concDark, 0, -.95, 0); o.add(cap);
    [-1.9, 1.9].forEach(z => o.add(box(.8, .2, .8, steelD, 0, YP + .1, z)));
    o.position.set(x, 0, 0);
    addEl({ id: 'ML' + n, name: `Pier ML${n}`, cat: 'pier', grp: L2('ตอม่อ ML24–ML33', 'Piers ML24–ML33'), obj: o, start: t0, finish: t0 + DAY / 2, kind: 'gen', dwg: 'MS Att.4 / Att.5', src: L2('ก่อสร้างแล้ว (สมมติ)', 'Existing (assumed)'), qty: { H: YP } });
    label('ML' + n, V(x, 1.6, 5.2), '#22b8cf', 'ml' + n, 'grid', .55);
  }

  /* ---------- span layout ---------- */
  const EXP = [33, 30, 27];
  const SP = [1, 2, 3, 4, 5, 6].map(k => { const rear = 34 - k, front = 33 - k; return { k, rear, front, xr: PX(rear), xf: PX(front), rearExp: EXP.includes(rear), frontExp: EXP.includes(front), key: 'S' + k, lbl: `ML${rear}–ML${front}` }; });
  // span type per MS: S1 first span (Att.4), S2 follows Att.4 SEQ 5–16, then Att.3 continuous: first/second/last of a unit
  SP.forEach(s => s.type = s.k === 1 ? 'first' : s.k === 2 ? 'att4' : s.frontExp ? 'last' : s.rearExp ? 'cfirst' : 'csecond');
  const segAll = [];
  SP.forEach(s => {
    s.segs = [];   // hang order: front → rear
    if (s.frontExp) s.segs.push({ id: `ES-ML${s.front}a`, x: s.xf - .05 - LE / 2, L: LE, solid: true, kind: 'end', px: s.xf - .05 - LE / 2 - 2.5 });
    if (s.rearExp && s.k > 1) s.segs.push({ id: `ES-ML${s.rear}b`, x: s.xr + .05 + LE / 2, L: LE, solid: true, kind: 'end', px: s.xr + .05 + LE / 2 + 2.5 });
    for (let i = 12; i >= 1; i--) s.segs.push({ id: `S${s.k}-T${String(i).padStart(2, '0')}`, x: s.xr + LP / 2 + CJ + (i - .5) * LT, L: LT, solid: false, kind: 'typ', i });
    s.joints = [s.xr + LP / 2 + CJ / 2, s.xf - LP / 2 - CJ / 2];
    s.pier = s.frontExp ? null : { id: `PS-ML${s.front}`, x: s.xf, L: LP, solid: true, kind: 'pier' };
  });

  /* ---------- phase timeline ---------- */
  const PH = []; KK.ph = PH;
  const T = { prep: [.3, .4, .3, .15, .55, .3, .35, .5], lift: .12, joint: .4, cast: .2, cure: 1.3, stress: .6, fin: .3 };
  const tx2 = (a, s) => a.replace(/\{D\}/g, 'ML' + s.rear).replace(/\{E\}/g, 'ML' + s.front).replace(/\{C\}/g, 'ML' + (s.rear + 1));
  const CODES = {
    cfirst: ['SEQ 1', 'SEQ 2', 'SEQ 3', 'SEQ 4', 'SEQ 5', 'SEQ 6', 'SEQ 7', 'SEQ 8', 'SEQ 9'],
    csecond: ['SEQ 10', 'SEQ 11', 'SEQ 12', 'SEQ 12', 'SEQ 13', 'SEQ 14', 'SEQ 15', 'SEQ 16–17', 'SEQ 18'],
    last: ['SEQ 19', 'SEQ 20', 'SEQ 21', 'SEQ 22', 'SEQ 23', 'SEQ 24', 'SEQ 25', 'SEQ 26–27', 'SEQ 28'],
    att4: ['Att.4 SEQ 4', 'Att.4 SEQ 5–8', 'Att.4 SEQ 9', 'Att.4 SEQ 10', 'Att.4 SEQ 11', 'Att.4 SEQ 12', 'Att.4 SEQ 13–14', 'Att.4 SEQ 15–16', 'SEQ 9 (Att.3)'],
  };
  const TXT = {
    rel: ['ปลด PT BAR ที่แขวนชิ้นส่วน · ถอด Temporary PT bar และ Hanging frame ของช่วง {C}–{D}', 'Release hanger PT bars · remove temporary PT bars and hanging frames of span {C}–{D}'],
    launch: ['เลื่อน Winch trolley ไปท้าย Gantry · เลื่อน Launching gantry ไปยังเสา {E} · ค้ำ Front leg (FL) บนเสา {E}', 'Winch trolley to the rear · launch the gantry to pier {E} · front leg (FL) on pier {E}'],
    launchA4: ['ปรับ Main truss ลาด 1.5% · ติดตั้ง Rear leg (RL) บน End segment ML33 · เลื่อน Gantry ไปยัง ML31 · ค้ำ FL บน ML31', 'Main truss to 1.5 % · rear leg (RL) on end segment ML33 · launch the gantry to ML31 · FL on ML31'],
    psb: ['ติดตั้ง Pier side bracket ที่ {E} ด้วย 10T service crane', 'Install the pier side bracket at {E} with the 10 t service crane'],
    fl: ['เลื่อน Launching gantry · ค้ำ Front leg (FL) บน Pier side bracket', 'Shift the gantry · front leg (FL) onto the pier side bracket'],
    ps: ['ติดตั้ง Pier bracket และ Pier segment {E} ด้วย Winch trolley', 'Set the pier bracket and pier segment {E} with the winch trolley'],
    pb: ['ติดตั้ง Pier bracket ที่ {E} ด้วย Winch trolley (ตอม่อ Expansion)', 'Set the pier bracket at {E} with the winch trolley (expansion pier)'],
    rml: ['ยึด Rear leg (RL) กับชิ้นส่วนที่ติดตั้งแล้ว · ย้าย Rear middle leg (RML) ไปชิด Front middle leg (FML)', 'Fix the rear leg (RL) on the erected deck · move RML next to FML'],
    rmlA4: ['Activate RL · ย้าย RML ชิด FML · ล็อค RML กับ Main truss · ปรับลาด Main truss 3.5%', 'Activate RL · move RML next to FML · lock RML to the main truss · main truss to 3.5 %'],
    fml: ['Activate RML · ย้าย FML ไปวางบน Pier segment {E} · ถอด Pier bracket ด้วย Winch trolley', 'Activate RML · move FML onto pier segment {E} · remove the pier bracket with the winch trolley'],
    fmlPB: ['Activate RML · ย้าย FML ไปวางบน Pier bracket {E}', 'Activate RML · move FML onto the pier bracket at {E}'],
    fmlA4: ['ย้าย FML ไปวางบน Pier segment ML31 · Winch ไปหน้า · หด FL · ปรับลาด 1.5% · ปลด Pier side bracket', 'FML onto pier segment ML31 · winch to the front · retract FL · back to 1.5 % · release the pier side bracket'],
    move: ['เคลื่อน Gantry เข้าตำแหน่งติดตั้ง {D}–{E} · ถอด Pier side bracket · RL ชิด RML · ย้าย RML วางบน Pier segment {D} · Retract RL', 'Move the gantry to the erection position {D}–{E} · remove the pier side bracket · RL to RML · RML onto pier segment {D} · retract RL'],
    moveA4: ['เลื่อน Launching gantry ไปด้านหน้า 15 m · Activate RL · ย้าย RML วางบน Pier segment ML32 · เตรียมยกชิ้นงาน ML32–ML31', 'Launch the gantry 15 m forward · activate RL · RML onto pier segment ML32 · ready to erect ML32–ML31'],
    hang: ['ติดตั้งชิ้นส่วนระหว่าง {D} และ {E} — แขวนด้วย Hanging frame + PT bar', 'Erect the segments between {D} and {E} — hung on hanging frames + PT bars'],
    joint: ['ปรับแนว/ระดับ · ติดตั้งแบบ Closure joint และกระเช้าสำหรับดึงลวด', 'Align and level · closure-joint formwork and stressing platforms'],
    cast: ['เทคอนกรีต Closure joint', 'Cast the closure joints'],
    cure: ['บ่มคอนกรีต รอผลทดสอบกำลังอัดลูกปูน', 'Cure — wait for the cube results'],
    stress: ['ดึงลวด External tendon ตามแบบที่ได้รับอนุมัติ', 'Stress the external tendons per the approved drawings'],
    fin: ['ปลด PT bar และ Hanging frame ทั้งหมด · จบการติดตั้งแบบ Continuous span', 'Release all PT bars and hanging frames · continuous span complete'],
  };
  const add = (a, dur, s, code, txt, fn, extra = {}) => { const p = { a, b: a + dur * DAY, s, code, th: tx2(txt[0], s), en: tx2(txt[1], s), fn, ...extra }; PH.push(p); return p.b; };

  // ---- state helpers (S is rebuilt every frame by replaying the phases) ----
  const ease = u => u * u * (3 - 2 * u);
  const FH = s => s.xf + 17;                       // truss front when erecting span s (FML at s.xf, FL suspended)
  const ACT = { FLon: YB - YP, FLbr: YB - 11.48, FLoff: 2.2, RL: YB - YT, RLoff: 1.8 };
  // low-bed trailer: drives in along the work zone beside the piers (z = -3.5), slides under the pick point, leaves after the hook takes the load
  const truckPose = (u, px, seg, uLoad) => { if (u >= .42) return null; const d = ((px % SPAN) + SPAN) % SPAN, dir = d < SPAN / 2 ? 1 : -1;
    let x = px, z = 0; if (u < .07) { x = lerp(px - dir * 50, px, ease(u / .07)); z = -3.5; } else if (u < .12) z = lerp(-3.5, 0, ease((u - .07) / .05)); else if (u >= .35) { x = lerp(px, px + dir * 60, ease((u - .35) / .07)); z = -3.5; } else if (u >= .3) z = lerp(0, -3.5, ease((u - .3) / .05));
    return { x, z, dir, load: u < uLoad ? seg : null }; };
  const liftFn = (seg, pickX, noHF) => (S, u) => {       // winch trolley lifts one segment from the trailer below
    const xs = seg.x, px = pickX ?? xs, yTop0 = 1.6 + DEP + .02, yHi = YT + .45;
    S.truck = truckPose(u, px, seg, .22);
    let sx = px, sy = yTop0;
    if (u < .14) { S.trol = lerp(S.trol, px, ease(u / .14)); S.hook = lerp(YTT - 1, yTop0 + .5, ease(u / .14)); }
    else if (u < .22) { S.trol = px; S.hook = yTop0 + .5; }
    else if (u < .62) { const k = ease((u - .22) / .4); S.trol = px; sy = lerp(yTop0, yHi, k); S.hook = sy + .5; }
    else if (u < .8) { const k = ease((u - .62) / .18); sx = lerp(px, xs, k); S.trol = sx; sy = yHi; S.hook = sy + .5; }
    else if (u < .9) { const k = ease((u - .8) / .1); sx = xs; S.trol = xs; sy = lerp(yHi, YT, k); S.hook = sy + .5; }
    else { sx = xs; sy = YT; S.trol = xs; S.hook = lerp(YT + .5, YTT - 1, ease((u - .9) / .1)); if (!noHF) S.hf[seg.id] = seg.x; }
    if (u < .9) { S.carry = { id: seg.id, x: sx, y: sy }; }
    if (u >= .22 && u < .9) S.spread = { x: sx, y: sy + .3 };
  };
  const relHF = (S, u, s) => { const ids = Object.keys(S.hf); ids.forEach((id, i) => { if (u > (i + 1) / (ids.length + 1)) delete S.hf[id]; }); if (u > .9) S.plat = []; };

  // ---- first span (Att.4 SEQ 1–4) ----
  const s1 = SP[0];
  { const [a, b] = date('FS-CRANE').map(D), h = (b - a) / 2 / DAY;

  function fromTokens(toks) { const dur = /^\d+(\.\d+)?\s*e?(days?|d|wks?|w|hrs?|h|mons?|mo|วัน)\??$/i, dt = /(\d{1,2}\/\d{1,2}\/\d{2,4})/, tasks = new Map();
    for (let i = 0; i < toks.length - 4; i++) { if (!/^\d{1,5}$/.test(toks[i])) continue; let j = i + 1, name = toks[j]; if (!name || /^\d+([,.]\d+)*$/.test(name) || dt.test(name) || dur.test(name)) continue; j++;
      if (!dur.test(toks[j]) && toks[j + 1] && dur.test(toks[j + 1]) && !dt.test(toks[j])) { name += ' ' + toks[j]; j++; } if (!dur.test(toks[j])) continue;
      const s = (toks[j + 1] || '').match(dt), f = (toks[j + 2] || '').match(dt); if (!s || !f) continue; const id = +toks[i]; if (!tasks.has(id)) tasks.set(id, { id, name: name.trim(), start: parseDate(s[1]), finish: parseDate(f[1]) }); i = j + 2; }
